; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = /dev/cu.usbserial-533C0036771
board_upload.maximum_size = 4194304
board_build.partitions = no_ota.csv
build_flags = 
	-DCORE_DEBUG_LEVEL=0
	-D DEVKIT1
	-D OLEDDISPLAY
lib_deps = 
	NTPClient
	thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays@^4.2.0
	bblanchon/ArduinoJson@^6.17.3
	pubsubclient
	ayushsharma82/AsyncElegantOTA @ ^2.2.5
	bodmer/TFT_eSPI@2.4.25
	mathieucarbou/ESP Async WebServer@2.10.8

[env:ttgo-t-display]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
upload_port = /dev/cu.usbserial-533C0036771
board_upload.maximum_size = 4194304
board_build.partitions = no_ota.csv
build_flags = 
	-DCORE_DEBUG_LEVEL=0
	-D TTGO
	-D USER_SETUP_LOADED=1
	-D ST7789_DRIVER
	-D TFT_SDA_READ
	-D TFT_WIDTH=135
	-D TFT_HEIGHT=240
	-D CGRAM_OFFSET
	-D TFT_MOSI=19
	-D TFT_SCLK=18
	-D TFT_CS=5
	-D TFT_DC=16
	-D TFT_RST=23
	-D TFT_BL=4
	-D TFT_BACKLIGHT_ON=HIGH
	-D LOAD_GLCD
	-D LOAD_FONT2
	-D LOAD_FONT4
	-D LOAD_FONT6
	-D LOAD_FONT7
	-D LOAD_FONT8
	-D LOAD_GFXFF
	-D SMOOTH_FONT
	-D SPI_FREQUENCY=40000000
	-D SPI_READ_FREQUENCY=6000000
lib_deps = 
	NTPClient
	bblanchon/ArduinoJson@^6.17.3
	pubsubclient
;	ayushsharma82/AsyncElegantOTA @ ^2.2.9
	bodmer/TFT_eSPI@2.4.25
	mathieucarbou/ESP Async WebServer@2.10.8
	;https://github.com/ayushsharma82/AsyncElegantOTA.git#bd2b4b9c7e7ba1a61e75b87ae146b0f04a51d92a
;	https://github.com/ayushsharma82/AsyncElegantOTA.git


	lib_ignore =
  ESP8266 and ESP32 OLED driver for SSD1306 displays
	
